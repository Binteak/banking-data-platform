name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Django tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Run tests with coverage
        run: |
          coverage run manage.py test api
          coverage report
          coverage xml -o coverage.xml

      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend · Angular tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (Chrome headless)
        run: npm run test:ci

      - name: Production build
        run: npx ng build --configuration production

      - name: Make lcov paths relative to the repo root
        run: sed -i 's#^SF:src/#SF:frontend/src/#' coverage/frontend/lcov.info

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/lcov.info
          retention-days: 7

  sonar:
    name: SonarQube Cloud · quality gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # historial completo para el análisis de código nuevo

      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend

      - uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend

      - name: Check Sonar token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::SONAR_TOKEN not configured, skipping SonarQube analysis"; fi

      - name: SonarQube Cloud scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
