# SonarQube Cloud — Banking Data Platform
# Comprueba projectKey y organization en SonarQube Cloud (Information del proyecto).
sonar.projectKey=Binteak_banking-data-platform
sonar.organization=binteak
sonar.projectName=Banking Data Platform

# Código fuente
sonar.sources=backend/api,frontend/src
sonar.tests=backend/api/tests.py,frontend/src
sonar.test.inclusions=**/*.spec.ts,backend/api/tests.py
sonar.exclusions=**/*.spec.ts,backend/api/tests.py,backend/api/migrations/**,**/node_modules/**,**/assets/**,frontend/src/**/*.css

# Contenido estático (textos, traducciones, datos mock): no es lógica, se excluye del cálculo de coverage
sonar.coverage.exclusions=frontend/src/environments/**,frontend/src/app/i18n/es.ts,frontend/src/app/documentation/content/**,frontend/src/app/service/mock-initial-data.ts,frontend/src/main.ts,backend/api/management/commands/build_demo_seed.py

# Informes de coverage generados en el workflow de GitHub Actions
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

sonar.sourceEncoding=UTF-8
